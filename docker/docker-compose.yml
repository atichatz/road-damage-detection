# docker-compose.yml — Road Damage Detection Demo
# ITCS352 Deep Learning Project | ICT Mahidol 2026 | DewPerawis
#
# Usage:
#   Build + start:  docker compose up --build
#   Start only  :  docker compose up
#   Stop        :  docker compose down
#   Logs        :  docker compose logs -f

services:
  road-damage-demo:
    build:
      context: .          # build context = project root (where Dockerfile lives)
      dockerfile: Dockerfile
    image: road-damage-demo:latest
    container_name: road_damage_demo
    ports:
      - "7860:7860"       # host:container — open http://localhost:7860
    environment:
      # Force CPU inference inside container (change to '0' if running with --gpus all)
      - CUDA_VISIBLE_DEVICES=-1
    restart: unless-stopped

